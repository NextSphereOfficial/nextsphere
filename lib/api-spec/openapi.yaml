openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Contact form operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: submitContactMessage
      tags: [contact]
      summary: Send a contact form message
      description: Validates and forwards a website contact request to the NextSphere team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "200":
          description: Message accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Email service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactMessageInput:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - phone
        - message
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
          maxLength: 254
        phone:
          type: string
          minLength: 6
          maxLength: 32
        message:
          type: string
          minLength: 10
          maxLength: 4000
        website:
          type: string
          maxLength: 0
    ContactMessageResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

