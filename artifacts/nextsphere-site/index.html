    <!-- Service Worker registration — required for PWA install prompt on Chrome/Android -->

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (err) {

          });

    <!-- Fonts: self-hosted woff2 — loaded via @font-face in index.css (zero external requests) -->

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "NextSphere",
      "url": "https://nextsphere.it",
      "logo": {
        "@type": "ImageObject",
        "url": "https://nextsphere.it/og-image.png",
        "width": 1200,
        "height": 630
      },
      "email": "info@nextsphere.it",
      "description": "Chatbot AI premium per host di B&B, case vacanze e appartamenti.",
      "foundingDate": "2025",
      "areaServed": "IT"
    }
    </script>

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NextSphere",
      "url": "https://nextsphere.it",
      "description": "Chatbot AI per host di B&B, case vacanze e affitti brevi. NextSphere risponde agli ospiti 24/7 via QR code.",
      "inLanguage": ["it", "en"],
      "publisher": {
        "@type": "Organization",
        "name": "NextSphere"
      }
    }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "NextSphere",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Chatbot AI per host di affitti brevi e B&B. Gli ospiti scansionano un QR code e ottengono risposte 24/7 nella loro lingua.",
      "offers": {
        "@type": "AggregateOffer",
        "lowPrice": "24.00",
        "highPrice": "39.00",
        "priceCurrency": "EUR",
        "offerCount": "4",
        "description": "Piani NextSphere da €24 a €39/unità/mese, prezzi finali senza costi aggiuntivi"
      },
      "featureList": [
        "Disponibile 24/7",
        "Risponde in oltre 30 lingue",
        "QR code pronto subito",
        "Nessuna app per gli ospiti",
        "Personalizzazione completa"
      ]
    }
    </script>

    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "È difficile da configurare?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Assolutamente no. L'onboarding guidato richiede meno di 10 minuti. Rispondi solo a qualche domanda sulla tua struttura e NextSphere costruisce la base di conoscenza automaticamente."
          }
        },
        {
          "@type": "Question",
          "name": "Devo essere sempre online per farlo funzionare?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No, NextSphere funziona in totale autonomia, 24/7. Puoi dormire sonni tranquilli mentre lui risponde agli ospiti."
          }
        },
        {
          "@type": "Question",
          "name": "Funziona per qualsiasi tipo di struttura ricettiva?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sì! NextSphere è perfettamente adattato per B&B, case vacanza, affitti brevi, appartamenti e boutique hotel. Funziona sia con Airbnb che con Booking.com."
          }
        },
        {
          "@type": "Question",
          "name": "Il chatbot risponde in più lingue?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sì, NextSphere rileva automaticamente la lingua dell'ospite e risponde nativamente, supportando oltre 30 lingue in modo impeccabile."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto costa NextSphere?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Il piano base parte da €39/mese per un singolo appartamento. Per strutture con 10 o più unità è possibile richiedere un preventivo personalizzato. Puoi provarlo gratis per 14 giorni senza carta di credito."
          }
        },
        {
          "@type": "Question",
          "name": "Cosa succede dopo i 14 giorni di prova?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Puoi scegliere il piano adatto al tuo numero di strutture. Se decidi di non continuare, il QR code smetterà semplicemente di funzionare — nessun addebito inaspettato."
          }
        },
        {
          "@type": "Question",
          "name": "Posso modificare le risposte del chatbot?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Certamente. Hai il controllo completo sulla base di conoscenza di NextSphere e puoi aggiornare regole della casa, password del Wi-Fi o raccomandazioni in qualsiasi momento."
          }
        }
      ]
    }
    </script>
